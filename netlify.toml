[build]
  command = "pnpm run build"
  publish = ".next"

[functions]
  node_bundler = "nft"
  included_files = ["generated/prisma/**"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--version"

# Tell Netlify to use pnpm
[build.processing]
  skip_processing = false
