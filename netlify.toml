[build]
  command = "pnpm run build && cp libquery_engine-rhel-openssl-1.0.x.so.node .next/server/app/api/graphql"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--version"

# Tell Netlify to use pnpm
[build.processing]
  skip_processing = false
