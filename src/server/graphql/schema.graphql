type User {
  id: ID!
  email: String!
  name: String
  posts: [Post!]!
}

type Post {
  id: ID!
  title: String!
  content: String
  published: Boolean!
  author: User!
  authorId: String!
}

type RideType {
  id: ID!
  name: String!
  description: String!
  capacity: Int!
  eta: String!
  priceMultiplier: Float!
  basePrice: Float!
}

type SearchSuggestion {
  id: ID!
  name: String!
  address: String!
  lat: Float!
  lng: Float!
}

type RecentLocation {
  id: ID!
  name: String!
  address: String!
  lat: Float!
  lng: Float!
}

type SavedPlace {
  id: ID!
  name: String!
  address: String!
  icon: String!
}

type RideHistory {
  id: ID!
  date: String!
  pickup: String!
  dropoff: String!
  price: String!
  driverName: String!
  driverRating: Float!
  vehicleType: String!
  status: String!
  duration: String!
  distance: String!
}

type Driver {
  id: ID!
  name: String!
  rating: Float!
  trips: Int!
  vehicle: String!
  licensePlate: String!
  eta: Int!
  avatarInitials: String!
}

type Query {
  users: [User!]!
  user(id: ID!): User
  posts: [Post!]!
  post(id: ID!): Post
  publishedPosts: [Post!]!
}

type Mutation {
  createUser(email: String!, name: String): User!
  updateUser(id: ID!, email: String, name: String): User!
  deleteUser(id: ID!): User!

  createPost(title: String!, content: String, authorId: String!): Post!
  updatePost(id: ID!, title: String, content: String, published: Boolean): Post!
  deletePost(id: ID!): Post!
  publishPost(id: ID!): Post!
}
